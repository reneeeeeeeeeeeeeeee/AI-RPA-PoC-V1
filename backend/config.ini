# ERP Assistant Configuration
# Adjust this file before starting

[erp]
# URL of your ERP installation
url = http://localhost/erp/
# or e.g.: http://192.168.1.100/erp

# ERP login credentials (used for automatic login)
username = admin
password = 123456789

[models]
# Path to the LLM (Gemma)
llm_path = llm

# Path to CogAgent
cogagent_path = ui

# GPU VRAM in GB – if less than 60 GB, 4-bit quantization is enabled
# Enter your GPU capacity here (e.g. 24 for RTX 3090)
gpu_vram_gb = 24

[server]
host = 0.0.0.0
port = 8000

[paths]
uploads = uploads
jobs    = jobs
